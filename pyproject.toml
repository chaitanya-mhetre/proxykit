[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxykit"
version = "1.0.0"
description = "Fast proxy validation, anonymity scoring, and scraping session rotation for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chaitanya Mhetre" }]
keywords = ["proxy", "scraping", "socks", "http", "anonymity", "rotation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx[socks]>=0.27.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "respx>=0.21.0"]

[project.scripts]
proxykit = "proxykit.cli:app"

[project.urls]
Homepage = "https://github.com/chaitanya-mhetre/proxykit"
Issues = "https://github.com/chaitanya-mhetre/proxykit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
